<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360">
  <defs>
    <style>
      .bg    { fill: #0d1117; }
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 22px; font-weight: 800; fill: #e6edf3; letter-spacing: 0px; }
      .sub   { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #7F77DD; letter-spacing: 2px; }
      .box   { fill: #161b22; stroke-width: 1.5; }
      .b-wrap { stroke: #6b7280; }
      .b-mcp  { stroke: #7F77DD; }
      .b-web  { stroke: #5DCAA5; }
      .b-win  { stroke: #EF9F27; }
      .h      { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 800; text-anchor: middle; }
      .b      { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 400; text-anchor: middle; fill: #9aa4b2; }
      .t-wrap { fill: #9aa4b2; }
      .t-mcp  { fill: #AFA9EC; }
      .t-web  { fill: #5DCAA5; }
      .t-win  { fill: #EF9F27; }
      .arrow { stroke: #3a4150; stroke-width: 2; }
      .note  { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #e6edf3; }
      .ex    { font-family: Consolas, monospace; font-size: 11px; fill: #9aa4b2; }
      .dot-pu { fill: #7F77DD; }
      .dot-tl { fill: #5DCAA5; }
      .dot-am { fill: #EF9F27; }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#3a4150"/>
    </marker>
  </defs>

  <rect width="860" height="360" rx="16" class="bg"/>

  <text x="30" y="38" class="title">ONE REPO = THREE FACES</text>
  <text x="30" y="58" class="sub">MCP FOR AGENTS &#183; WEBAPP + WINAPP FOR HUMANS</text>

  <!-- Box 1: wrapped tool -->
  <g>
    <rect x="30" y="80" width="175" height="120" rx="8" class="box b-wrap"/>
    <text x="117" y="104" class="h t-wrap">WRAPPED TOOL</text>
    <text x="117" y="124" class="b">docker &#183; git &#183; blender</text>
    <text x="117" y="140" class="b">plex &#183; yahboom &#183; arxiv</text>
    <text x="117" y="164" class="b">the app or device</text>
    <text x="117" y="180" class="b">you already use</text>
  </g>

  <!-- Box 2: MCP server -->
  <g>
    <rect x="225" y="80" width="185" height="120" rx="8" class="box b-mcp"/>
    <text x="317" y="104" class="h t-mcp">MCP SERVER</text>
    <text x="317" y="124" class="b">tools for AI agents</text>
    <text x="317" y="140" class="b">Claude &#183; Cursor &#183; IDEs</text>
    <text x="317" y="164" class="b">local or cloud model</text>
    <text x="317" y="180" class="b">runs the tasks</text>
  </g>

  <!-- Box 3: webapp -->
  <g>
    <rect x="430" y="80" width="195" height="120" rx="8" class="box b-web"/>
    <text x="527" y="104" class="h t-web">WEBAPP (browser)</text>
    <text x="527" y="124" class="b">dark dashboard</text>
    <text x="527" y="140" class="b">buttons &#183; logs &#183; telemetry</text>
    <text x="527" y="164" class="b">watch &#183; approve &#183; stop</text>
  </g>

  <!-- Box 4: winapp -->
  <g>
    <rect x="645" y="80" width="185" height="120" rx="8" class="box b-win"/>
    <text x="737" y="104" class="h t-win">WINAPP (desktop)</text>
    <text x="737" y="124" class="b">Tauri + NSIS .exe</text>
    <text x="737" y="140" class="b">same UI, no browser</text>
    <text x="737" y="164" class="b">double-click install</text>
  </g>

  <!-- Arrows: tool -> mcp -> humans -->
  <line x1="205" y1="140" x2="222" y2="140" class="arrow" marker-end="url(#ah)"/>
  <line x1="410" y1="125" x2="427" y2="125" class="arrow" marker-end="url(#ah)"/>
  <line x1="410" y1="160" x2="427" y2="160" class="arrow" marker-end="url(#ah)"/>
  <line x1="625" y1="125" x2="642" y2="125" class="arrow" marker-end="url(#ah)"/>
  <line x1="625" y1="160" x2="642" y2="160" class="arrow" marker-end="url(#ah)"/>

  <!-- Competitor note -->
  <text x="30" y="232" class="note">The 10k-star single-tool alternative: MCP only. No webapp. No winapp.</text>

  <!-- Example flows -->
  <g>
    <circle cx="38" cy="258" r="4" class="dot-pu"/>
    <text x="50" y="262" class="ex">docker-mcp: see containers + images + networks, agent lists stale images, trawls crash logs</text>
    <circle cx="38" cy="284" r="4" class="dot-tl"/>
    <text x="50" y="288" class="ex">git-github-mcp: morning sweep for open PRs and CI failures, stale flags in dashboard</text>
    <circle cx="38" cy="310" r="4" class="dot-am"/>
    <text x="50" y="314" class="ex">aiwatcher-mcp: trawls news sources, writes digest, posts it to your Discord guild</text>
  </g>

  <text x="30" y="342" class="b" text-anchor="start">Full flows live in the category pages, not here. This diagram is the whole pitch.</text>
</svg>
